[project]
name = "swing-dataset"
version = "0.1.0"
description = "Commodity Open 2026 dataset builders: MCX history, calendar, macro, comparators, features, pack."
requires-python = ">=3.13,<3.14"
dependencies = [
    "curl-cffi>=0.10",
    "httpx[http2]>=0.28.1",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=17",
    "pypdf>=6.18.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
browser = ["camoufox[geoip]>=0.4.11"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swing_dataset"]
ignore-vcs = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
